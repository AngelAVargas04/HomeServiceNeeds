<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomeNeedsService</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #fdfaf5;"> <nav class="navbar navbar-expand-lg" style="background-color: #7d5ba6;"> <div class="container">
            <a class="navbar-brand text-white font-weight-bold" href="/">HomeNeedsService</a>
            <div class="navbar-nav ms-auto">
                {% if session.get('user_id') %}
                    <a class="nav-link text-white" href="{{ url_for('browse') }}">Browse Services</a>
                    <a class="nav-link text-white" href="{{ url_for('bookings') }}">Bookings</a>
                    <a class="nav-link text-white" href="{{ url_for('account_redirect') }}">Account</a>
                    <a class="nav-link text-white" href="{{ url_for('account_redirect') }}#provider-setup">Join as Provider</a>
                    <a class="nav-link text-white" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-link text-white" href="{{ url_for('login') }}">Login</a>
                    <a class="nav-link text-white" href="{{ url_for('register') }}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 border-top">
        <p>&copy; 2026 Group GAFA - Secure Marketplace</p>
    </footer>
</body>
</html>
